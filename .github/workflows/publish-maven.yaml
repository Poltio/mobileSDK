name: Publish to Maven Central

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3). Required when dispatched manually — release runs use the release tag instead."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish AAR to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${MANUAL_VERSION:-${RELEASE_TAG#v}}"
          if [ -z "$VERSION" ]; then
            echo "No version resolved: pass 'version' when dispatching manually, or run this from a published release." >&2
            exit 1
          fi
          echo "Publishing version '${VERSION}'."
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central
        env:
          LIB_VERSION: ${{ steps.version.outputs.value }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew :poltio-sdk:publishAndReleaseToMavenCentral \
            -PlibVersion="${LIB_VERSION}" --no-configuration-cache
