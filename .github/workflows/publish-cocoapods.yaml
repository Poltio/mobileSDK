name: Publish to CocoaPods

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Push Podspec to CocoaPods Trunk
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sync Podspec Version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "main" ] && [ "$VERSION" != "master" ]; then
            echo "Syncing PoltioSDK.podspec version to '${VERSION}' from tag '${RELEASE_TAG}'..."
            chmod +x scripts/bump-version.sh
            ./scripts/bump-version.sh "$VERSION"
          else
            echo "No release tag detected. Using existing manifest version."
          fi

      - name: Deploy to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*s\.version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" PoltioSDK.podspec)

          # Trunk can commit the spec to CocoaPods/Specs and still time out reporting it,
          # so a failed push (or a re-run that hits "duplicate entry") is checked against the Specs repo.
          published() {
            local data_url
            data_url=$(curl -sf "https://trunk.cocoapods.org/api/v1/pods/PoltioSDK/versions/${VERSION}" | jq -r '.data_url // empty')
            [ -n "$data_url" ] && curl -sfL "$data_url" | jq -e --arg v "$VERSION" '.version == $v' > /dev/null
          }

          if published; then
            echo "PoltioSDK ${VERSION} is already on CocoaPods trunk."
            exit 0
          fi

          if pod trunk push PoltioSDK.podspec --allow-warnings; then
            exit 0
          fi

          for _ in $(seq 1 8); do
            if published; then
              echo "::warning::pod trunk push failed, but PoltioSDK ${VERSION} landed in CocoaPods/Specs."
              exit 0
            fi
            sleep 15
          done

          echo "::error::PoltioSDK ${VERSION} is not on CocoaPods trunk."
          exit 1
